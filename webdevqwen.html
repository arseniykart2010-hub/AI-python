<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCodeCamp — бесплатный курс Python с практикой</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230e1420'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-600-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-700-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-800-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/cyrillic-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/cyrillic-700-normal.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
:root{
  --bg:#0c111c;
  --bg2:#111827;
  --panel:#151d2e;
  --panel2:#1a2438;
  --border:#253149;
  --border2:#31405e;
  --text:#e8edf7;
  --muted:#93a0bb;
  --yellow:#ffd43b;
  --blue:#4b8bbe;
  --blue2:#6db3e8;
  --green:#3ddc84;
  --red:#ff6b6b;
  --orange:#ffa94d;
  --radius:14px;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  min-height:100vh;
}
::selection{background:rgba(255,212,59,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3d5280}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue2)}

/* ===== HEADER ===== */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:64px;
  background:rgba(12,17,28,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  padding:0 20px;
}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo svg{width:38px;height:38px;flex-shrink:0}
.logo-text{font-weight:800;font-size:20px;letter-spacing:-.5px}
.logo-text span{color:var(--yellow)}
.header-progress{flex:1;max-width:340px;display:flex;align-items:center;gap:10px}
.hp-bar{flex:1;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1);width:0%}
.hp-label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.xp-badge{
  display:flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--border);
  padding:6px 14px;border-radius:99px;
  font-weight:700;font-size:14px;color:var(--yellow);
}
.py-status{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
  background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:99px;
}
.py-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.2s infinite}
.py-dot.ready{background:var(--green);animation:none}
@keyframes pulse{50%{opacity:.35}}
.burger{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;width:42px;height:42px;font-size:20px;align-items:center;justify-content:center}
.header-cert-btn{
  background:linear-gradient(135deg,var(--yellow),#f0a800);color:#1a1400;border:none;
  font-weight:700;padding:9px 18px;border-radius:10px;font-size:14px;transition:.2s;
}
.header-cert-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,212,59,.3)}

/* ===== LAYOUT ===== */
.layout{display:flex;padding-top:64px;min-height:100vh}
aside{
  width:320px;flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  height:calc(100vh - 64px);
  position:sticky;top:64px;
  overflow-y:auto;
  padding:18px 14px 40px;
}
main{flex:1;min-width:0;padding:28px 32px 80px;max-width:1100px;margin:0 auto;width:100%}

/* ===== SIDEBAR ===== */
.side-search{position:relative;margin-bottom:16px}
.side-search input{
  width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:10px 14px 10px 38px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:.2s;
}
.side-search input:focus{border-color:var(--blue)}
.side-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.side-home-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:11px 14px;border-radius:10px;font-weight:700;font-size:14px;margin-bottom:16px;transition:.2s;
}
.side-home-btn:hover{border-color:var(--blue);background:var(--panel2)}
.mod-block{margin-bottom:8px;border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.mod-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;transition:.15s;
}
.mod-head:hover{background:var(--panel2)}
.mod-emoji{font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:9px;flex-shrink:0}
.mod-title{flex:1;font-weight:700;font-size:13.5px;line-height:1.35}
.mod-count{font-size:11px;color:var(--muted);font-weight:600;background:var(--bg2);padding:2px 8px;border-radius:99px;flex-shrink:0}
.mod-count.done{color:var(--green)}
.mod-chev{color:var(--muted);transition:.25s;flex-shrink:0;font-size:11px}
.mod-block.open .mod-chev{transform:rotate(90deg)}
.mod-items{display:none;padding:4px 8px 10px}
.mod-block.open .mod-items{display:block}
.lesson-link{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:8px;cursor:pointer;
  font-size:13px;color:var(--muted);transition:.15s;font-weight:500;
}
.lesson-link:hover{background:var(--panel2);color:var(--text)}
.lesson-link.active{background:rgba(75,139,190,.16);color:var(--blue2);font-weight:700}
.lesson-link.done{color:var(--green)}
.ll-check{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;
}
.lesson-link.done .ll-check{background:var(--green);border-color:var(--green);color:#06281a}
.ll-check.quiz-mark{border-radius:5px;border-color:var(--yellow);color:var(--yellow)}
.lesson-link.done .ll-check.quiz-mark{background:var(--yellow);color:#3a2e00;border-color:var(--yellow)}

/* ===== HOME ===== */
.hero{
  background:linear-gradient(135deg,#12203a 0%,#152440 45%,#1d2a1a 100%);
  border:1px solid var(--border);border-radius:20px;
  padding:44px 40px;margin-bottom:28px;position:relative;overflow:hidden;
}
.hero::before{
  content:'{ } < > def py for if';
  position:absolute;right:-10px;top:-10px;font-family:var(--mono);font-size:70px;font-weight:700;
  color:rgba(255,255,255,.03);white-space:nowrap;transform:rotate(8deg);pointer-events:none;
}
.hero-tag{
  display:inline-block;background:rgba(255,212,59,.14);color:var(--yellow);
  border:1px solid rgba(255,212,59,.3);font-size:12px;font-weight:700;
  padding:5px 14px;border-radius:99px;margin-bottom:16px;letter-spacing:.5px;text-transform:uppercase;
}
.hero h1{font-size:clamp(26px,4vw,42px);font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{color:var(--muted);max-width:560px;margin-bottom:26px;font-size:16px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  border:none;border-radius:11px;font-weight:700;font-size:15px;
  padding:13px 26px;transition:.2s;display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--yellow),#f0a800);color:#1a1400;box-shadow:0 4px 16px rgba(255,212,59,.25)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 16px rgba(75,139,190,.3)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{border-color:var(--blue2);color:var(--blue2)}
.btn-green{background:var(--green);color:#06281a}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:9px 18px;font-size:13.5px;border-radius:9px}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:32px}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;text-align:center;
}
.stat-num{font-size:30px;font-weight:800;color:var(--yellow);letter-spacing:-1px}
.stat-num.blue{color:var(--blue2)}
.stat-num.green{color:var(--green)}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}

.section-title{font-size:22px;font-weight:800;margin-bottom:18px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
.mod-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;cursor:pointer;transition:.22s;position:relative;overflow:hidden;
}
.mod-card:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.mc-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.mc-emoji{font-size:26px;width:52px;height:52px;background:var(--bg2);border:1px solid var(--border);border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mc-title{font-weight:800;font-size:16px;line-height:1.3}
.mc-num{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.mc-desc{font-size:13.5px;color:var(--muted);margin-bottom:16px;min-height:42px}
.mc-prog{display:flex;align-items:center;gap:10px}
.mc-bar{flex:1;height:7px;background:var(--bg2);border-radius:99px;overflow:hidden}
.mc-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .5s}
.mc-pct{font-size:12px;font-weight:700;color:var(--muted)}
.mc-badge{
  position:absolute;top:14px;right:14px;background:rgba(61,220,132,.15);color:var(--green);
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid rgba(61,220,132,.35);
}
.cert-banner{
  background:linear-gradient(135deg,#2a2410,#1d2a1a);border:1px solid rgba(255,212,59,.4);
  border-radius:var(--radius);padding:26px 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:30px;
}
.cert-banner .cb-icon{font-size:44px}
.cert-banner h3{font-size:19px;font-weight:800;margin-bottom:4px}
.cert-banner p{color:var(--muted);font-size:14px}
.cert-banner .btn{margin-left:auto}

/* ===== LESSON ===== */
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}
.crumb b{color:var(--blue2)}
.lesson-head{margin-bottom:8px}
.lesson-head h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.8px;line-height:1.2}
.lesson-meta{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 26px;font-size:13px;color:var(--muted)}
.lesson-meta span{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);padding:5px 12px;border-radius:99px;font-weight:600}
.theory{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px 34px;margin-bottom:28px}
.theory h3{font-size:20px;font-weight:800;margin:26px 0 12px;letter-spacing:-.3px;color:var(--yellow)}
.theory h3:first-child{margin-top:0}
.theory p{margin-bottom:14px;color:#c9d3e6}
.theory ul,.theory ol{margin:0 0 14px 22px;color:#c9d3e6}
.theory li{margin-bottom:7px}
.theory strong{color:var(--text)}
.theory code{
  font-family:var(--mono);font-size:.86em;background:var(--bg2);border:1px solid var(--border);
  padding:2px 7px;border-radius:6px;color:var(--yellow);
}
.codeblock-wrap{position:relative;margin:16px 0}
pre.codeblock{
  font-family:var(--mono);font-size:13.5px;line-height:1.65;
  background:#0a0f1a;border:1px solid var(--border);border-radius:11px;
  padding:18px 20px;overflow-x:auto;color:#dbe4f3;
}
.copy-btn{
  position:absolute;top:9px;right:9px;background:var(--panel2);border:1px solid var(--border2);
  color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:7px;opacity:0;transition:.2s;
}
.codeblock-wrap:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--yellow);border-color:var(--yellow)}
.tip,.warn{
  border-radius:11px;padding:14px 18px;margin:16px 0;font-size:14.5px;
}
.tip{background:rgba(75,139,190,.1);border:1px solid rgba(75,139,190,.35);border-left:4px solid var(--blue)}
.warn{background:rgba(255,169,77,.08);border:1px solid rgba(255,169,77,.35);border-left:4px solid var(--orange)}
.tip b,.warn b{display:block;margin-bottom:3px}

/* syntax highlight */
.c-kw{color:#c792ea}.c-str{color:#a5d97f}.c-num{color:#f78c6c}.c-com{color:#5f7394;font-style:italic}.c-bi{color:#82aaff}

/* ===== CHALLENGE ===== */
.challenge-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:28px;
}
.ch-head{
  background:linear-gradient(90deg,rgba(255,212,59,.1),transparent);
  border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;
}
.ch-head h2{font-size:17px;font-weight:800}
.ch-badge{margin-left:auto;font-size:12px;font-weight:800;color:var(--yellow);background:rgba(255,212,59,.12);border:1px solid rgba(255,212,59,.3);padding:4px 12px;border-radius:99px}
.ch-task{padding:18px 24px;font-size:14.5px;color:#c9d3e6;border-bottom:1px solid var(--border)}
.ch-task code{font-family:var(--mono);font-size:.87em;background:var(--bg2);border:1px solid var(--border);padding:2px 6px;border-radius:5px;color:var(--yellow)}
.ch-task ul{margin:8px 0 4px 20px}
.editor{background:#0a0f1a}
.editor-toolbar{
  display:flex;align-items:center;gap:8px;padding:9px 14px;background:#0d1424;border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.et-file{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);padding:4px 12px;border-radius:7px;border:1px solid var(--border);margin-right:auto}
.tbtn{
  background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:8px;transition:.15s;display:flex;align-items:center;gap:6px;
}
.tbtn:hover{border-color:var(--blue2)}
.tbtn.run{background:var(--blue);border-color:var(--blue);color:#fff}
.tbtn.run:hover{background:#5b9bd0}
.tbtn.check{background:var(--yellow);border-color:var(--yellow);color:#1a1400}
.tbtn.check:hover{background:#ffde5f}
.editor-body{display:flex;max-height:420px}
.gutter{
  font-family:var(--mono);font-size:13.5px;line-height:1.65;color:#3d4d6e;
  padding:14px 10px 14px 14px;text-align:right;user-select:none;overflow:hidden;background:#0a0f1a;
  border-right:1px solid var(--border);flex-shrink:0;min-width:44px;
}
#codeArea{
  flex:1;background:transparent;border:none;outline:none;resize:none;color:#dbe4f3;
  font-family:var(--mono);font-size:13.5px;line-height:1.65;padding:14px 16px;
  min-height:220px;height:340px;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
.console{
  border-top:1px solid var(--border);background:#070b14;
  font-family:var(--mono);font-size:13px;padding:14px 18px;min-height:70px;max-height:220px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word;color:#b9c6dd;line-height:1.55;
}
.console .c-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
.console .err{color:var(--red)}
.console .ok{color:var(--green)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.test-result{padding:16px 24px;display:none;align-items:center;gap:14px;border-top:1px solid var(--border);font-weight:700;font-size:14.5px}
.test-result.show{display:flex}
.test-result.pass{background:rgba(61,220,132,.09);color:var(--green)}
.test-result.fail{background:rgba(255,107,107,.08);color:var(--red)}
.tr-icon{font-size:26px}
.test-result .tr-msg{flex:1;font-weight:500}
.hint-btn{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--muted);font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px}
.hint-box{display:none;padding:0 24px 16px;font-size:13.5px;color:var(--orange);background:rgba(255,169,77,.06)}
.hint-box.show{display:block}

.lesson-nav{display:flex;gap:12px;flex-wrap:wrap}
.lesson-nav .btn{flex:1;justify-content:center;min-width:180px}
.next-glow{animation:glow 1.6s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 6px rgba(61,220,132,.3)}50%{box-shadow:0 0 22px rgba(61,220,132,.65)}}

/* ===== QUIZ ===== */
.quiz-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px 34px;margin-bottom:22px}
.quiz-q{font-size:18px;font-weight:800;margin-bottom:18px;display:flex;gap:12px}
.quiz-q .qnum{color:var(--yellow);flex-shrink:0}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{
  display:flex;align-items:center;gap:13px;background:var(--bg2);border:2px solid var(--border);
  border-radius:11px;padding:13px 17px;cursor:pointer;transition:.15s;font-size:15px;font-weight:500;
}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.selected{border-color:var(--yellow);background:rgba(255,212,59,.07)}
.quiz-opt.correct{border-color:var(--green);background:rgba(61,220,132,.1)}
.quiz-opt.wrong{border-color:var(--red);background:rgba(255,107,107,.08)}
.quiz-opt.disabled{pointer-events:none}
.opt-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.quiz-opt.selected .opt-radio{border-color:var(--yellow)}
.quiz-opt.selected .opt-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.quiz-opt.correct .opt-radio{border-color:var(--green)}
.quiz-opt.wrong .opt-radio{border-color:var(--red)}
.quiz-opt code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:2px 7px;border-radius:5px;color:var(--yellow)}
.quiz-result{text-align:center;padding:20px 0}
.quiz-score{font-size:56px;font-weight:800;letter-spacing:-2px}
.quiz-result p{color:var(--muted);margin-bottom:20px}

/* ===== CERTIFICATE ===== */
.cert-page{max-width:860px;margin:0 auto}
.cert-form{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px;margin-bottom:26px}
.cert-form h2{font-size:22px;font-weight:800;margin-bottom:6px}
.cert-form p{color:var(--muted);font-size:14px;margin-bottom:18px}
.cert-form input{
  width:100%;max-width:440px;background:var(--bg2);border:2px solid var(--border);color:var(--text);
  padding:13px 18px;border-radius:11px;font-size:16px;font-family:inherit;outline:none;margin-bottom:16px;
}

const outLines = (s)=> (s||'').replace(/\r/g,'').trim().split('\n').map(x=>x.trim());
const eqLines = (output, arr)=> outLines(output).join('|') === arr.join('|');
const ok  = (msg)=>({pass:true,  msg: msg||'Отлично! Задача решена ✅'});
const bad = (msg)=>({pass:false, msg});

/* =========================================================
   КУРРИКУЛУМ
   ========================================================= */
const CURRICULUM = [
{
  id:'m1', title:'Введение в Python', emoji:'🚀', xp:30,
  desc:'История языка, первая программа, функция print(), переменные и типы данных.',
  lessons:[
  {
    id:'1-1', title:'Знакомство с Python', minutes:8,
    theory:`
<h3>Что такое Python?</h3>
<p><strong>Python</strong> — один из самых популярных языков программирования в мире. Его создал <strong>Гвидо ван Россум</strong> в 1991 году. Название произошло не от змеи, а от британского комедийного шоу «Monty Python's Flying Circus».</p>
<p>Python используют в самых разных областях:</p>
<ul>
  <li>🌐 <strong>Веб-разработка</strong> — Django, Flask, FastAPI</li>
  <li>🤖 <strong>ИИ и машинное обучение</strong> — TensorFlow, PyTorch, scikit-learn</li>
  <li>📊 <strong>Анализ данных</strong> — Pandas, NumPy, Matplotlib</li>
  <li>🎮 <strong>Игры и скрипты</strong> — Pygame, автоматизация задач</li>
</ul>
<h3>Первая программа</h3>
<p>Традиционно изучение языка начинается с вывода текста «Привет, мир!». Для этого используется функция <code>print()</code>:</p>
<pre class="codeblock">print("Привет, мир!")
print('Одинарные кавычки тоже работают')
print(2024)  # можно выводить и числа</pre>
<div class="tip"><b>💡 Совет</b>Текст в Python называется <strong>строкой</strong> и обязательно заключается в кавычки: двойные <code>"..."</code> или одинарные <code>'...'</code> — разницы нет.</div>
<h3>Комментарии</h3>
<p>Всё, что стоит после символа <code>#</code>, игнорируется интерпретатором — это комментарий для программиста:</p>
<pre class="codeblock"># Это комментарий
print("А эта строка выполнится")  # и комментарий в конце строки</pre>`,
    challenge:{
      title:'Скажи «Python — это круто!»',
      task:`Используйте функцию <code>print()</code>, чтобы вывести на экран фразу:<br><br><code>Python — это круто!</code><br><br>Обратите внимание на тире «—» и восклицательный знак — вывод должен совпасть точно.`,
      starter:`# Напишите ваш код здесь\n`,
      hint:'Скопируйте фразу в кавычки: print("Python — это круто!")',
      test: async ({output, error})=>{
        if(error) return bad('Код вызвал ошибку: '+error.split('\n').pop());
        return output.trim()==='Python — это круто!'
          ? ok('Идеально! Ваша первая программа на Python работает! 🎉')
          : bad(`Ожидался вывод «Python — это круто!», а получено: «${output.trim()||'(пусто)'}»`);
      }
    }
  },
  {
    id:'1-2', title:'Функция print() подробно', minutes:10,
    theory:`
<h3>Несколько значений</h3>
<p>В <code>print()</code> можно передавать несколько значений через запятую. По умолчанию они разделяются пробелом:</p>
<pre class="codeblock">print("Язык", "Python", 3)</pre>
<h3>Параметры sep и end</h3>
<p><code>sep</code> задаёт разделитель между значениями, а <code>end</code> — то, что выводится в конце (по умолчанию перевод строки <code>"\\n"</code>):</p>
<pre class="codeblock">print("a", "b", "c", sep="-")      # a-b-c
print("строка1", end=" ")
print("строка2")                    # всё на одной строке
print(1, 2, 3, sep=" *** ")         # 1 *** 2 *** 3</pre>
<h3>Экранирование и спецсимволы</h3>
<ul>
  <li><code>\\n</code> — новая строка</li>
  <li><code>\\t</code> — табуляция</li>
  <li><code>\\"</code> — кавычка внутри строки</li>
</ul>
<pre class="codeblock">print("Первая строка\\nВторая строка")
print("Он сказал: \\"Привет!\\"")</pre>
<div class="tip"><b>💡 Совет</b>Экспериментируйте прямо в редакторе ниже — код выполняется в настоящем интерпретаторе Python прямо в браузере!</div>`,
    challenge:{
      title:'Разделитель слов',
      task:`Выведите слова <code>Раз</code>, <code>Два</code>, <code>Три</code> в <strong>одном вызове print()</strong>, используя параметр <code>sep</code>, чтобы получился результат:<br><br><code>Раз-Два-Три</code>`,
      starter:`print("Раз", "Два", "Три")  # добавьте sep\n`,
      hint:'Добавьте аргумент sep="-" через запятую после слов.',
      test: async ({output, error})=>{
        if(error) return bad('Ошибка: '+error.split('\n').pop());
        return output.trim()==='Раз-Два-Три'
          ? ok('Отлично! Вы освоили параметр sep ✅')
          : bad(`Ожидалось «Раз-Два-Три», получено: «${output.trim()||'(пусто)'}»`);
      }
    }
  },
  {
    id:'1-3', title:'Переменные и типы данных', minutes:12,
    theory:`
<h3>Что такое переменная?</h3>
<p><strong>Переменная</strong> — это «коробка» с именем, в которой хранится значение. Для создания используется присваивание <code>=</code>:</p>
<pre class="codeblock">city = "Москва"
age = 25
temperature = 36.6
is_student = True

print(city)         # Москва
print(age + 1)      # 26</pre>
<h3>Основные типы данных</h3>
<ul>
  <li><code>str</code> — строка: <code>"текст"</code></li>
  <li><code>int</code> — целое число: <code>42</code></li>
  <li><code>float</code> — дробное число: <code>3.14</code></li>
  <li><code>bool</code> — логический: <code>True</code> / <code>False</code></li>
</ul>
<p>Узнать тип значения можно функцией <code>type()</code>:</p>
<pre class="codeblock">x = 100
print(type(x))   # &lt;class 'int'&gt;
print(type("hi"))  # &lt;class 'str'&gt;</pre>
<h3>Правила имён переменных</h3>
<ul>
  <li>Могут содержать буквы, цифры и <code>_</code>, но не начинаться с цифры</li>
  <li>Регистр важен: <code>Name</code> и <code>name</code> — разные переменные</li>
  <li>Нельзя использовать ключевые слова: <code>if</code>, <code>for</code>, <code>class</code>…</li>
</ul>
<div class="warn"><b>⚠️ Важно</b>Python — динамически типизированный язык: в одну и ту же переменную можно записать сначала число, потом строку. Но хорошей практикой считается этого избегать.</div>`,
    challenge:{
      title:'Визитная карточка',
      task:`Создайте переменную <code>city</code> со значением <code>"Москва"</code> и переменную <code>population</code> со значением <code>13000000</code>. Затем выведите значение переменной <code>city</code> с помощью <code>print()</code>.`,
      starter:`# создайте переменные и выведите city\n`,
      hint:'city = "Москва"\npopulation = 13000000\nprint(city)',
      test: async ({output, error, getVar})=>{
        if(error) return bad('Ошибка: '+error.split('\n').pop());
        const c = getVar('city'), p = getVar('population');
        if(c !== 'Москва') return bad('Переменная city должна быть равна "Москва"');
        if(p !== 13000000) return bad('Переменная population должна быть равна 13000000');
        return output.trim()==='Москва'
          ? ok('Верно! Переменные созданы и выведены ✅')
          : bad('Переменные созданы правильно, но print(city) должен вывести «Москва»');
      }
    }
  }],
  quiz:[
    {q:'Кто создал язык Python?', opts:['Джеймс Гослинг','Гвидо ван Россум','Бьёрн Страуструп','Деннис Ритчи'], ans:1},
    {q:'Какая функция выводит данные на экран?', opts:['<code>echo()</code>','<code>console.log()</code>','<code>print()</code>','<code>write()</code>'], ans:2},
    {q:'Какое имя переменной корректно?', opts:['<code>2var</code>','<code>my-var</code>','<code>class</code>','<code>my_var2</code>'], ans:3}
  ]
},
{
  id:'m2', title:'Данные и операции', emoji:'🔢', xp:30,
  desc:'Числа и арифметика, строковые операции, преобразование типов.',
  lessons:[
  {
    id:'2-1', title:'Числа и арифметические операции', minutes:12,
    theory:`
<h3>Арифметика в Python</h3>
<pre class="codeblock">a, b = 17, 5
print(a + b)   # 22  сложение
print(a - b)   # 12  вычитание
print(a * b)   # 85  умножение
print(a / b)   # 3.4 деление (всегда float)
print(a // b)  # 3   целочисленное деление
print(a % b)   # 2   остаток от деления
print(a ** b)  # 1419857  возведение в степень</pre>
<h3>Порядок операций</h3>
<p>Как в математике: сначала <code>**</code>, затем <code>* / // %</code>, потом <code>+ -</code>. Скобки меняют порядок:</p>
<pre class="codeblock">print(2 + 3 * 4)      # 14
print((2 + 3) * 4)    # 20</pre>
<h3>Полезные встроенные функции</h3>
<pre class="codeblock">print(abs(-7))       # 7   модуль
print(round(3.1415, 2))  # 3.14
print(min(4, 9, 1))  # 1
print(max(4, 9, 1))  # 9</pre>
<div class="tip"><b>💡 Совет</b>Проверка на чётность — это <code>n % 2 == 0</code>. Остаток от деления используется очень часто!</div>`,
    challenge:{
      title:'Калькулятор',
      task:`Даны <code>a = 17</code> и <code>b = 5</code>. Выведите <strong>по порядку, каждое на новой строке</strong>: сумму, разность, произведение, результат обычного деления <code>/</code> и остаток от деления <code>%</code>.<br><br>Ожидаемый вывод:<br><code>22</code><br><code>12</code><br><code>85</code><br><code>3.4</code><br><code>2</code>`,
      starter:`a = 17\nb = 5\n# выведите 5 результатов по порядку\n`,
      hint:'Нужно 5 вызовов print: a+b, a-b, a*b, a/b, a%b.',
      test: async ({output, error})=>{
        if(error) return bad('Ошибка: '+error.split('\n').pop());
        return eqLines(output, ['22','12','85','3.4','2'])
          ? ok('Все пять операций выполнены верно! 🧮✅')
          : bad('Ожидались строки: 22, 12, 85, 3.4, 2 — каждая на новой строке. Получено: ' + (outLines(output).join(' / ')||'(пусто)'));
      }
    }
  },
  {
    id:'2-2', title:'Строки и операции с ними', minutes:14,
    theory:`
<h3>Создание и конкатенация</h3>
<pre class="codeblock">first = "Py"
last = "thon"
word = first + last       # конкатенация: "Python"
line = "-" * 20           # повторение строки
print(word, len(word))    # Python 6</pre>
<h3>Индексы и срезы</h3>
<p>Символы строки нумеруются с нуля. Отрицательный индекс — отсчёт с конца:</p>
<pre class="codeblock">s = "Python"
print(s[0])     # P
print(s[-1])    # n
print(s[0:2])   # Py   (срез: со 0-го до 2-го, не включая)
print(s[2:])    # thon
print(s[::-1])  # nohtyp — переворот строки</pre>
<h3>Методы строк</h3>
<pre class="codeblock">t = "  Привет, Python  "
print(t.strip())        # убирает пробелы по краям
print(t.upper())        # ПРИВЕТ, PYTHON
print(t.lower())        # привет, python
print("Py" in t)        # True — проверка вхождения
print(t.replace("Python", "мир"))</pre>
<h3>f-строки — удобный формат</h3>
<pre class="codeblock">name = "Аня"
age = 20
print(f"Меня зовут {name}, мне {age} лет")</pre>
<div class="tip"><b>💡 Совет</b>f-строки (с буквой <code>f</code> перед кавычкой) — самый современный и читаемый способ подставлять значения в текст.</div>`,
    challenge:{
      title:'Исследуем строку',
      task:`Дана строка <code>s = "python"</code>. Выведите по порядку, каждый результат на новой строке:<ol><li>строку в верхнем регистре (<code>s.upper()</code>)</li><li>длину строки</li><li>первый символ</li><li>последний символ (через отрицательный индекс)</li><li>перевёрнутую строку (срез <code>[::-1]</code>)</li></ol>Ожидаемый вывод:<br><code>PYTHON</code><br><code>6</code><br><code>p</code><br><code>n</code><br><code>nohtyp</code>`,
      starter:`s = "python"\n# 5 вызовов print по заданию\n`,
      hint:'print(s.upper()), print(len(s)), print(s[0]), print(s[-1]), print(s[::-1])',
      test: async ({output, error})=>{
        if(error) return bad('Ошибка: '+error.split('\n').pop());
        return eqLines(output, ['PYTHON','6','p','n','nohtyp'])
          ? ok('Строки покоряются вам! ✅')
          : bad('Ожидались строки: PYTHON, 6, p, n, nohtyp. Получено: ' + (outLines(output).join(' / ')||'(пусто)'));
      }
    }
  },
  {
    id:'2-3', title:'Преобразование типов и input()', minutes:12,
    theory:`
<h3>Зачем преобразовывать типы?</h3>
<p>Числа и строки не складываются друг с другом — нужно приводить их к одному типу:</p>
<pre class="codeblock">print("5" + "5")        # "55" — склеивание строк
print(int("5") + int("5"))  # 10 — теперь числа
print(str(5) + str(5))      # "55"
print(float("3.14"))    # 3.14
print(int(3.99))        # 3 — дробная часть отбрасывается</pre>
<h3>Функции преобразования</h3>
<ul>
  <li><code>int(x)</code> — в целое число</li>
  <li><code>float(x)</code> — в дробное число</li>
  <li><code>str(x)</code> — в строку</li>
  <li><code>bool(x)</code> — в логический тип</li>
</ul>
<h3>Ввод данных: input()</h3>
<p><code>input()</code> читает строку, введённую пользователем. Результат — <strong>всегда строка</strong>:</p>
<pre class="codeblock">name = input("Как вас зовут? ")
print("Привет,", name)

age = int(input("Сколько вам лет? "))  # преобразуем
print(f"Через 10 лет вам будет {age + 10}")</pre>
<div class="warn"><b>⚠️ Важно</b>Если пользователь введёт не число, <code>int(input())</code> упадёт с ошибкой <code>ValueError</code>. Об ошибкам — в модуле 7.</div>

    id:'3-1', title:'Условия: if, elif, else', minutes:14,
    theory:`
<h3>Условный оператор</h3>
<p>Код в Python группируется <strong>отступами</strong> (обычно 4 пробела). После условия ставится двоеточие:</p>
<pre class="codeblock">age = 20
if age &gt;= 18:
    print("Доступ разрешён")
else:
    print("Доступ запрещён")</pre>
<h3>Несколько веток: elif</h3>
<pre class="codeblock">score = 75
if score &gt;= 90:
    print("Отлично")
elif score &gt;= 70:
    print("Хорошо")
elif score &gt;= 50:

else:

<h3>Операторы сравнения и логики</h3>
<ul>

</ul>

elif is_weekend or is_sunny:

temp = 25
if 20 &lt;= temp &lt;= 30:   # двойное сравнение

<h3>Повторение по условию</h3>
<p>Цикл <code>while</code> повторяет блок кода, <strong>пока условие истинно</strong>:</p>
<pre class="codeblock">count = 1
while count &lt;= 5:
    print("Итерация", count)
    count += 1   # не забудьте изменить условие!</pre>
<h3>Оператор += и друзья</h3>
<pre class="codeblock">x = 10
x += 5   # x = x + 5 → 15
x -= 3   # 12
x *= 2   # 24</pre>
<h3>break и continue</h3>
<ul>
  <li><code>break</code> — немедленно выйти из цикла</li>
  <li><code>continue</code> — перейти к следующей итерации</li>
</ul>
<pre class="codeblock">i = 0
while True:
    i += 1
    if i % 2 == 0:
        continue    # пропускаем чётные
    print(i)
    if i &gt; 8:
        break       # выходим</pre>

<h3>Перебор последовательностей</h3>
<p><code>for</code> проходит по каждому элементу последовательности:</p>
<pre class="codeblock">for letter in "Python":
    print(letter)

for fruit in ["яблоко", "банан", "вишня"]:

<h3>Функция range()</h3>
<pre class="codeblock">for i in range(5):        # 0 1 2 3 4
    print(i)

for i in range(2, 8, 2):  # 2 4 6  (от 2 до 8 с шагом 2)

<ul>
  <li><code>range(n)</code> — числа от 0 до n-1</li>

  <li><code>range(a, b, step)</code> — с шагом step</li>

<h3>enumerate — индекс и значение</h3>

    theory:`
<h3>Зачем нужны функции?</h3>
<p>Функция — это именованный блок кода, который можно вызывать многократно. Она помогает не повторяться (принцип DRY — Don't Repeat Yourself):</p>
<pre class="codeblock">def greet():
    print("Привет!")
    print("Добро пожаловать!")

greet()   # вызов функции
greet()   # можно вызывать сколько угодно раз</pre>
<h3>Параметры функции</h3>
<p>В скобках после имени указываются <strong>параметры</strong> — данные, которые функция принимает:</p>
<pre class="codeblock">def greet_person(name):
    print(f"Привет, {name}!")

greet_person("Аня")    # Привет, Аня!
greet_person("Боря")   # Привет, Боря!

def sum_two(a, b):
    print(a + b)

sum_two(3, 5)   # 8</pre>
<div class="tip"><b>💡 Совет</b>Имена функций пишутся в <code>snake_case</code> — маленькими буквами через подчёркивание: <code>calculate_total</code>, <code>send_email</code>.</div>`,

<h3>Возвращаем значение</h3>
<p><code>print()</code> показывает значение, а <code>return</code> — <strong>возвращает</strong> его наружу, чтобы использовать дальше:</p>
<pre class="codeblock">def square(x):
    return x ** 2

result = square(5)     # 25
print(result * 2)      # 50 — результат можно использовать</pre>
<h3>Несколько return и их отсутствие</h3>
<pre class="codeblock">def check(n):
    if n &lt; 0:
        return "отрицательное"
    return "неотрицательное"

def nothing():

print(nothing())   # None</pre>
<h3>Возврат нескольких значений</h3>
<pre class="codeblock">def stats(numbers):

lo, hi, total = stats([4, 8, 15, 16])

<h3>Анонимные функции lambda</h3>
<p><code>lambda</code> — маленькая функция в одну строку, без <code>def</code>:</p>
<pre class="codeblock">double = lambda x: x * 2
print(double(21))    # 42

add = lambda a, b: a + b
print(add(2, 3))     # 5</pre>
<p>Lambda удобно передавать в другие функции:</p>
<pre class="codeblock">words = ["python", "ai", "javascript"]
words.sort(key=lambda w: len(w))   # сортировка по длине
print(words)   # ['ai', 'python', 'javascript']</pre>
<h3>Область видимости</h3>

show()        # локальная
print(message)  # глобальная</pre>

  lessons:[
  {
    id:'5-1', title:'Списки (list)', minutes:16,
    theory:`
<h3>Создание и доступ</h3>
<p><strong>Список</strong> — изменяемая упорядоченная коллекция элементов:</p>
<pre class="codeblock">nums = [5, 2, 9, 1, 7]
mixed = [1, "два", 3.0, True]

print(nums[0])    # 5
print(nums[-1])   # 7
print(nums[1:3])  # [2, 9]</pre>
<h3>Изменение списка</h3>
<pre class="codeblock">fruits = ["яблоко"]
fruits.append("банан")     # в конец
fruits.insert(0, "манго")  # по индексу
fruits.remove("яблоко")    # удалить значение
last = fruits.pop()        # извлечь последний
print(fruits)</pre>
<h3>Полезные операции</h3>
<pre class="codeblock">nums = [5, 2, 9, 1, 7]
print(len(nums))       # 5
print(sum(nums))       # 24
print(max(nums), min(nums))   # 9 1
print(sorted(nums))    # [1, 2, 5, 7, 9] — новый список
print(9 in nums)       # True

for n in nums:         # перебор
    print(n)</pre>
<div class="tip"><b>💡 Совет</b><code>sorted(nums)</code> возвращает новый список, а <code>nums.sort()</code> меняет исходный.</div>`,

  {
    id:'5-2', title:'Кортежи (tuple)', minutes:10,

<h3>Неизменяемые списки</h3>
<p><strong>Кортеж</strong> похож на список, но его <strong>нельзя изменять</strong> после создания. Используются круглые скобки:</p>
<pre class="codeblock">point = (3, 5)
colors = ("red", "green", "blue")
single = (42,)   # запятая обязательна для одного элемента

print(point[0])      # 3
print(len(colors))   # 3
# point[0] = 10  →  TypeError!</pre>
<h3>Распаковка</h3>
<pre class="codeblock">x, y = (3, 5)

a, b = b, a   # классический обмен значений без третьей переменной</pre>
<h3>Когда использовать кортежи?</h3>
<ul>

</ul>

name, age = get_user()

{
  id:'m6', title:'Объектно-ориентированное программирование', emoji:'🏛️', xp:30,
  desc:'Классы и объекты, конструктор __init__, методы, атрибуты и наследование.',
  lessons:[
  {
    id:'6-1', title:'Классы и объекты', minutes:16,
    theory:`
<h3>Что такое ООП?</h3>
<p><strong>Класс</strong> — это чертёж, а <strong>объект</strong> — дом, построенный по этому чертежу. У объектов есть <em>атрибуты</em> (данные) и <em>методы</em> (действия):</p>
<pre class="codeblock">class Dog:
    def __init__(self, name):
        self.name = name       # атрибут

    def bark(self):            # метод
        print(f"{self.name} говорит Гав!")

# создаём объекты
rex = Dog("Рекс")
bobik = Dog("Бобик")

print(rex.name)   # Рекс
rex.bark()        # Рекс говорит Гав!
bobik.bark()      # Бобик говорит Гав!</pre>
<h3>Разбор по частям</h3>
<ul>
  <li><code>class Dog:</code> — объявление класса</li>
  <li><code>__init__</code> — конструктор, вызывается при создании объекта</li>
  <li><code>self</code> — ссылка на сам объект (обязательный первый параметр методов)</li>
  <li><code>self.name = name</code> — сохраняем атрибут</li>
</ul>
<div class="tip"><b>💡 Совет</b>Имена классов пишутся с большой буквы в стиле CamelCase: <code>Dog</code>, <code>BankAccount</code>, <code>UserProfile</code>.</div>`,

      starter:`class Dog:\n    # __init__ и bark\n    pass\n\n# создайте объект и вызовите bark()\n`,
      hint:'class Dog:\n    def __init__(self, name):\n        self.name = name\n    def bark(self):\n        print(f"{self.name} говорит Гав!")',

  {
    id:'6-2', title:'Атрибуты и методы на практике', minutes:14,
    theory:`
<h3>Объект с состоянием</h3>
<p>Методы могут не только выводить текст, но и <strong>изменять атрибуты</strong> объекта:</p>
<pre class="codeblock">class BankAccount:
    def __init__(self, owner):
        self.owner = owner
        self.balance = 0

    def deposit(self, amount):
        self.balance += amount
        print(f"Внесено {amount}. Баланс: {self.balance}")

    def withdraw(self, amount):
        if amount &gt; self.balance:
            print("Недостаточно средств!")
        else:
            self.balance -= amount
            print(f"Снято {amount}. Баланс: {self.balance}")

acc = BankAccount("Аня")
acc.deposit(1000)
acc.withdraw(300)
acc.withdraw(5000)
print(acc.balance)   # 700</pre>
<h3>Атрибуты класса vs атрибуты объекта</h3>
<pre class="codeblock">class Counter:
    total = 0            # общий для всех объектов

    def __init__(self):
        Counter.total += 1
        self.id = Counter.total

a = Counter(); b = Counter()
print(a.id, b.id, Counter.total)   # 1 2 2</pre>
<div class="tip"><b>💡 Совет</b>Каждый объект хранит <strong>своё</strong> состояние: два аккаунта могут иметь разный баланс, не мешая друг другу.</div>`,
    challenge:{
      title:'Банковский аккаунт',
      task:`Создайте класс <code>BankAccount</code>:<ul><li>в <code>__init__</code> атрибут <code>balance = 0</code></li><li>метод <code>deposit(amount)</code> — увеличивает баланс</li><li>метод <code>withdraw(amount)</code> — уменьшает баланс</li></ul>Создайте аккаунт, внесите 100, снимите 30 и выведите итоговый <code>balance</code>.<br><br>Ожидаемый вывод: <code>70</code>`,
      starter:`class BankAccount:\n    pass\n\n# создайте аккаунт, deposit(100), withdraw(30), print(balance)\n`,
      hint:'В __init__: self.balance = 0. В deposit: self.balance += amount. В withdraw: self.balance -= amount.',

  {
    id:'6-3', title:'Наследование', minutes:14,
    theory:`
<h3>Класс-родитель и класс-потомок</h3>
<p><strong>Наследование</strong> позволяет новому классу перенять атрибуты и методы существующего:</p>
<pre class="codeblock">class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        print(f"{self.name} издаёт звук")

    def eat(self):
        print(f"{self.name} кушает")

class Dog(Animal):        # Dog наследует Animal
    def speak(self):      # переопределяем метод
        print(f"{self.name} гавкает")

class Cat(Animal):
    def speak(self):
        print(f"{self.name} мяукает")

animals = [Dog("Бобик"), Cat("Мурка"), Animal("Некто")]
for a in animals:
    a.speak()   # полиморфизм: один вызов — разное поведение
# Бобик гавкает
# Мурка мяукает
# Некто издаёт звук</pre>
<h3>super() — вызов родительского кода</h3>
<pre class="codeblock">class Puppy(Dog):
    def __init__(self, name, age):
        super().__init__(name)   # конструктор родителя
        self.age = age

p = Puppy("Шарик", 1)
p.speak()      # Шарик гавкает
print(p.age)   # 1</pre>
<div class="tip"><b>💡 Совет</b>Три кита ООП: <strong>инкапсуляция</strong> (данные внутри объекта), <strong>наследование</strong> (переиспользование), <strong>полиморфизм</strong> (одинаковый интерфейс — разное поведение).</div>`,
    challenge:{
      title:'Зоопарк на наследовании',
      task:`Создайте класс <code>Animal</code> с конструктором <code>__init__(self, name)</code> и методом <code>speak()</code>, который выводит <code>{name} издаёт звук</code>.<br><br>Создайте класс <code>Dog(Animal)</code>, который <strong>переопределяет</strong> <code>speak()</code>: выводит <code>{name} гавкает</code>.<br><br>Создайте <code>Dog("Бобик")</code> и вызовите <code>speak()</code>.<br><br>Ожидаемый вывод: <code>Бобик гавкает</code>`,
      starter:`class Animal:\n    pass\n\nclass Dog(Animal):\n    pass\n\n# создайте Dog("Бобик") и вызовите speak()\n`,
      hint:'В Dog переопределите speak: def speak(self): print(f"{self.name} гавкает")',

        const r = await runPy('_x = Animal("Кот"); assert issubclass(Dog, Animal), "Dog должен наследовать Animal"');
        return r.ok ? ok('Наследование работает безупречно! 🦴✅')
                    : bad('Убедитесь, что Dog наследуется от Animal: class Dog(Animal):');
      }
    }
  }],

{
  id:'m7', title:'Продвинутый Python', emoji:'🎓', xp:40,

  lessons:[
  {
    id:'7-1', title:'Обработка ошибок: try/except', minutes:14,
    theory:`
<h3>Почему программы падают</h3>
<p>Деление на ноль, несуществующий файл, неверный тип — всё это <strong>исключения</strong>. Их можно ловить:</p>
<pre class="codeblock">try:
    result = 10 / 0
except ZeroDivisionError:
    print("На ноль делить нельзя!")

print("Программа продолжает работу")</pre>
<h3>Несколько исключений и else/finally</h3>
<pre class="codeblock">try:
    n = int("abc")
except ValueError:
    print("Это не число")
except TypeError:
    print("Неверный тип")
else:
    print("Ошибок не было")   # если try succeeded
finally:
    print("Выполнится всегда")</pre>
<h3>Популярные типы ошибок</h3>
<ul>
  <li><code>ValueError</code> — неверное значение (<code>int("abc")</code>)</li>
  <li><code>TypeError</code> — неверный тип (<code>"2" + 2</code>)</li>
  <li><code>ZeroDivisionError</code> — деление на ноль</li>
  <li><code>IndexError</code> — выход за границы списка</li>
  <li><code>KeyError</code> — нет такого ключа в словаре</li>
  <li><code>NameError</code> — переменная не найдена</li>
</ul>
<pre class="codeblock">def safe_divide(a, b):
    try:
        return a / b
    except ZeroDivisionError:
        return "Ошибка: деление на ноль"</pre>
<div class="tip"><b>💡 Совет</b>Не используйте «голый» <code>except:</code> без типа ошибки — он прячет баги. Ловите конкретные исключения.</div>`,
    challenge:{
      title:'Безопасное деление',
      task:`Напишите функцию <code>safe_divide(a, b)</code>, которая возвращает результат деления <code>a / b</code>, а при делении на ноль возвращает строку <code>Ошибка: деление на ноль</code> (используйте try/except).<br><br>Выведите результаты вызовов <code>safe_divide(10, 2)</code> и <code>safe_divide(10, 0)</code>.<br><br>Ожидаемый вывод (2 строки):<br><code>5.0</code><br><code>Ошибка: деление на ноль</code>`,
      starter:`def safe_divide(a, b):\n    # try / except ZeroDivisionError\n    pass\n\nprint(safe_divide(10, 2))\nprint(safe_divide(10, 0))\n`,
      hint:'try: return a / b  except ZeroDivisionError: return "Ошибка: деление на ноль"',
      test: async ({output, error})=>{
        if(error) return bad('Ошибка: '+error.split('\n').pop());

      }
    }
  },
  {
    id:'7-2', title:'Работа с файлами', minutes:14,
    theory:`
<h3>Чтение и запись файлов</h3>
<p>Конструкция <code>with</code> автоматически закрывает файл — это правильный способ:</p>
<pre class="codeblock"># запись (перезапись)
with open("data.txt", "w", encoding="utf-8") as f:
    f.write("Первая строка\\n")
    f.write("Вторая строка\\n")

# чтение целиком
with open("data.txt", "r", encoding="utf-8") as f:
    content = f.read()
    print(content)</pre>
<h3>Режимы открытия</h3>
<ul>
  <li><code>"r"</code> — чтение (по умолчанию)</li>
  <li><code>"w"</code> — запись (файл перезаписывается!)</li>
  <li><code>"a"</code> — добавление в конец</li>
</ul>
<h3>Чтение по строкам</h3>
<pre class="codeblock">with open("data.txt", encoding="utf-8") as f:
    for line in f:
        print(line.strip())   # strip убирает \\n в конце

# или сразу список строк:
with open("data.txt", encoding="utf-8") as f:
    lines = f.readlines()</pre>
<h3>Файл не найден?</h3>
<pre class="codeblock">try:
    with open("no_such.txt") as f:
        f.read()
except FileNotFoundError:
    print("Файл не существует")</pre>
<div class="tip"><b>💡 Совет</b>Всегда указывайте <code>encoding="utf-8"</code> — иначе кириллица может превратиться в «кракозябры».</div>
<p><em>Примечание: код выполняется в виртуальной среде Python прямо в браузере — файлы создаются в её виртуальной файловой системе.</em></p>`,

      starter:`# 1) записать в test.txt\n# 2) прочитать и вывести\n`,

/* ---------- STATE ---------- */
let state;
function loadState(){
  try{ state = JSON.parse(localStorage.getItem('pycamp_v1')) || {}; }catch(e){ state = {}; }
  state.lessons = state.lessons || {};
  state.quizzes = state.quizzes || {};
  state.xp = state.xp || 0;
  state.name = state.name || '';
  state.openMods = state.openMods || {m1:true};
}
function saveState(){ localStorage.setItem('pycamp_v1', JSON.stringify(state)); }
loadState();

const completedCount = ()=> Object.keys(state.lessons).length + Object.keys(state.quizzes).length;

/* ---------- PYODIDE ---------- */
let pyodidePromise = null;
function getPyodide(){
  if(!pyodidePromise){
    pyodidePromise = loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'}).then(py=>{
      document.getElementById('pyDot').classList.add('ready');
      document.getElementById('pyStatusText').textContent = 'Python готов';
      return py;
    }).catch(e=>{
      pyodidePromise = null;
      document.getElementById('pyStatusText').textContent = 'Ошибка загрузки Python';
      throw e;
    });
  }
  return pyodidePromise;
}
setTimeout(()=>{ getPyodide().catch(()=>{}); }, 800);

async function execUser(code){
  const py = await getPyodide();
  let error = null;
  py.runPython(`
import sys, io
_cap = io.StringIO()
_old_out = sys.stdout
sys.stdout = _cap
_ns = {"__name__": "__main__", "__builtins__": __builtins__}
`);
  py.globals.set('_code_str', code);
  try{
    await py.runPythonAsync('exec(_code_str, _ns)');
  }catch(e){
    error = String(e.message||e);
  }
  const output = py.runPython('_cap.getvalue()');
  py.runPython('sys.stdout = _old_out');
  const getVar = (n)=>{
    try{
      py.globals.set('_vn', n);
      return py.runPython('_ns.get(_vn, None)');
    }catch(e){ return null; }
  };
  const runPy = async (snippet)=>{
    try{
      py.globals.set('_ts', snippet);
      await py.runPythonAsync('exec(_ts, _ns)');
      return {ok:true};
    }catch(e){ return {ok:false, error:String(e.message||e)}; }
  };
  return {output, error, getVar, runPy, py};
}

/* ---------- SYNTAX HIGHLIGHT ---------- */
function hl(code){
  const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/(#.*$)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(def|class|if|elif|else|for|while|return|import|from|as|in|not|and|or|is|None|True|False|try|except|finally|raise|with|lambda|pass|break|continue|global|nonlocal|yield|assert|del)\b|\b(\d+\.?\d*)\b|\b(print|len|range|int|str|float|bool|input|list|dict|set|tuple|sum|min|max|abs|round|type|isinstance|sorted|enumerate|zip|map|filter|open|super|self)\b/gm,
  (m, com, str, kw, num, bi)=>{
    if(com) return '<span class="c-com">'+com+'</span>';
    if(str) return '<span class="c-str">'+str+'</span>';
    if(kw)  return '<span class="c-kw">'+kw+'</span>';
    if(num) return '<span class="c-num">'+num+'</span>';
    if(bi)  return '<span class="c-bi">'+bi+'</span>';
    return m;
  });
}
function decorateCodeBlocks(root){
  root.querySelectorAll('pre.codeblock').forEach(pre=>{
    const raw = pre.textContent;
    const wrap = document.createElement('div');
    wrap.className = 'codeblock-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    pre.innerHTML = hl(raw);
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Копировать';
    btn.onclick = ()=>{
      navigator.clipboard.writeText(raw).then(()=>{
        btn.textContent = '✓ Скопировано';
        setTimeout(()=> btn.textContent = '📋 Копировать', 1600);
      });
    };
    wrap.appendChild(pre);
    wrap.appendChild(btn);
  });
}

/* ---------- CONFETTI ---------- */
function confetti(){
  const colors = ['#ffd43b','#4b8bbe','#3ddc84','#ff6b6b','#ffa94d','#c792ea'];
  for(let i=0;i<70;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.width = (6+Math.random()*7)+'px';
    c.style.height = (8+Math.random()*10)+'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animation = `fall ${1.6+Math.random()*2}s ease-in forwards`;
    c.style.animationDelay = (Math.random()*0.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4200);
  }
}

function filterSidebar(q){
  q = q.toLowerCase().trim();
  document.querySelectorAll('#sideModules .lesson-link').forEach(el=>{
    el.style.display = (!q || el.dataset.search.includes(q)) ? '' : 'none';
  });

    const visible = b.querySelectorAll('.lesson-link:not([style*="display: none"])').length;
    b.style.display = (!q || visible>0) ? '' : 'none';
    if(q) b.classList.add('open'); 
  });
}
function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const open = force!==undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

      <div class="editor-body">
        <div class="gutter" id="gutter"></div>
        <textarea id="codeArea" spellcheck="false" wrap="off"></textarea>
      </div>
      <div class="console" id="console"><span class="c-label">Консоль вывода</span>Нажмите «▶ Запустить», чтобы выполнить код…</div>
    </div>
    <div class="test-result" id="testResult"><span class="tr-icon"></span><span class="tr-msg"></span><button class="hint-btn" id="hintBtn">💡 Подсказка</button></div>
    <div class="hint-box" id="hintBox"><b>Подсказка:</b><pre style="font-family:var(--mono);margin-top:6px;white-space:pre-wrap"></pre></div>
  </div>

  <div class="lesson-nav">
    ${prev ? `<button class="btn btn-ghost" onclick="navigate('lesson','${prev.id}')">← ${prev.title}</button>` : '<span></span>'}
    ${next
      ? `<button class="btn btn-blue" id="nextBtn" onclick="navigate('lesson','${next.id}')">Далее: ${next.title} →</button>`
      : `<button class="btn btn-blue" id="nextBtn" onclick="navigate('quiz','${mod.id}')">Далее: 📝 Тест по модулю →</button>`}
  </div>`;

  decorateCodeBlocks(main);
  document.querySelector('#hintBox pre').textContent = L.challenge.hint;
  document.getElementById('hintBtn').onclick = ()=> document.getElementById('hintBox').classList.toggle('show');

  // editor
  const area = document.getElementById('codeArea');
  const gutter = document.getElementById('gutter');
  const saved = localStorage.getItem('pycamp_code_'+L.id);
  area.value = saved!==null ? saved : L.challenge.starter;
  function updateGutter(){
    const n = area.value.split('\n').length;
    gutter.innerHTML = Array.from({length:n},(_,i)=>`<div>${i+1}</div>`).join('');
  }
  updateGutter();
  area.addEventListener('input', ()=>{ updateGutter(); localStorage.setItem('pycamp_code_'+L.id, area.value); });
  area.addEventListener('scroll', ()=>{ gutter.scrollTop = area.scrollTop; });
  area.addEventListener('keydown', e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s = area.selectionStart, en = area.selectionEnd;
      area.value = area.value.slice(0,s)+'    '+area.value.slice(en);
      area.selectionStart = area.selectionEnd = s+4;
      updateGutter();
      localStorage.setItem('pycamp_code_'+L.id, area.value);
    }
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); runCode(); }
  });

  const consoleEl = document.getElementById('console');
  const runBtn = document.getElementById('runBtn');
  const checkBtn = document.getElementById('checkBtn');

  async function runCode(){
    const code = area.value;
    localStorage.setItem('pycamp_code_'+L.id, code);
    runBtn.disabled = checkBtn.disabled = true;
    consoleEl.innerHTML = '<span class="c-label">Консоль вывода</span><span class="spinner"></span>Запуск Python (первый запуск может занять ~10 сек)…';
    try{
      const {output, error} = await execUser(code);
      let html = '<span class="c-label">Консоль вывода</span>';
      html += output ? output.replace(/&/g,'&amp;').replace(/</g,'&lt;') : '<span style="color:#5f7394">(нет вывода — добавьте print())</span>';
      if(error) html += '\n<span class="err">'+error.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';
      else if(output) html += '\n<span class="ok">— процесс завершён за 0 ошибок —</span>';
      consoleEl.innerHTML = html;
    }catch(e){
      consoleEl.innerHTML = '<span class="c-label">Консоль вывода</span><span class="err">Не удалось выполнить код: '+String(e)+'</span>';
    }
    runBtn.disabled = checkBtn.disabled = false;
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  async function checkTask(){
    const code = area.value;
    localStorage.setItem('pycamp_code_'+L.id, code);
    runBtn.disabled = checkBtn.disabled = true;
    const tr = document.getElementById('testResult');
    tr.className = 'test-result show';
    tr.querySelector('.tr-icon').textContent = '⏳';
    tr.querySelector('.tr-msg').textContent = 'Проверяем решение…';
    tr.style.color = 'var(--muted)';
    try{
      const ctx = await execUser(code);
      let result;
      try{ result = await L.challenge.test(ctx); }
      catch(te){ result = {pass:false, msg:'Ошибка проверки: '+String(te)}; }
      tr.className = 'test-result show ' + (result.pass?'pass':'fail');
      tr.querySelector('.tr-icon').textContent = result.pass?'🎉':'❌';
      tr.querySelector('.tr-msg').textContent = result.msg;
      if(result.pass && !state.lessons[L.id]){
        state.lessons[L.id] = true;
        state.xp += 10;
        saveState();
        confetti();
        updateHeader();
        renderSidebar();
        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('next-glow');
      } else if(result.pass){
        const nb = document.getElementById('nextBtn');
        if(nb) nb.classList.add('next-glow');
      }
    }catch(e){
      tr.className = 'test-result show fail';
      tr.querySelector('.tr-icon').textContent = '⚠️';
      tr.querySelector('.tr-msg').textContent = 'Не удалось запустить проверку: '+String(e);
    }
    runBtn.disabled = checkBtn.disabled = false;
  }

  runBtn.onclick = runCode;
  checkBtn.onclick = checkTask;
  document.getElementById('resetBtn').onclick = ()=>{
    area.value = L.challenge.starter;
    updateGutter();
    localStorage.setItem('pycamp_code_'+L.id, area.value);
    consoleEl.innerHTML = '<span class="c-label">Консоль вывода</span>Код сброшен к начальному.';
    document.getElementById('testResult').className = 'test-result';
  };
}

/* ---------- QUIZ ---------- */
function renderQuiz(main, moduleId){
  const mi = CURRICULUM.findIndex(m=>m.id===moduleId);
  if(mi<0) return navigate('home');
  const m = CURRICULUM[mi];
  state.openMods[m.id] = true; saveState();
  const passed = !!state.quizzes[m.id];

  main.innerHTML = `
  <div class="crumb" onclick="navigate('home')" style="cursor:pointer">🏠 Курс → <b>Модуль ${mi+1}: ${m.title}</b></div>
  <div class="lesson-head"><h1>📝 Тест: ${m.title}</h1></div>
  <div class="lesson-meta">
    <span>${m.quiz.length} вопроса</span>
    <span>⚡ +${m.xp} XP</span>
    <span>${passed?'✅ Тест сдан':'Нужно ответить верно на ВСЕ вопросы'}</span>
  </div>
  <div id="quizBody"></div>
  <div class="lesson-nav" style="margin-top:8px">
    <button class="btn btn-ghost" onclick="navigate('lesson','${m.lessons[m.lessons.length-1].id}')">← К последнему уроку модуля</button>
    <button class="btn btn-blue" onclick="navigate('home')">🏠 К программе курса</button>
  </div>`;

  const body = document.getElementById('quizBody');
  const answers = new Array(m.quiz.length).fill(null);

  m.quiz.forEach((q, qi)=>{
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.innerHTML = `
      <div class="quiz-q"><span class="qnum">${qi+1}.</span><span>${q.q}</span></div>
      <div class="quiz-opts">
        ${q.opts.map((o, oi)=>`
          <div class="quiz-opt" data-q="${qi}" data-o="${oi}">
            <div class="opt-radio"></div>
            <div>${o}</div>
          </div>`).join('')}
      </div>`;
    body.appendChild(card);
    card.querySelectorAll('.quiz-opt').forEach(opt=>{
      opt.onclick = ()=>{
        card.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        answers[qi] = parseInt(opt.dataset.o);
      };
    });
  });

  const btnWrap = document.createElement('div');
  btnWrap.style.textAlign = 'center';
  btnWrap.innerHTML = `<button class="btn btn-primary" id="quizSubmit" style="min-width:280px;justify-content:center">✓ Проверить ответы</button>
    <div class="quiz-result" id="quizResult" style="display:none"></div>`;
  body.appendChild(btnWrap);

  document.getElementById('quizSubmit').onclick = ()=>{
    if(answers.some(a=>a===null)){
      alert('Ответьте на все вопросы!');
      return;
    }
    let correct = 0;
    document.querySelectorAll('.quiz-opt').forEach(o=>o.classList.add('disabled'));
    m.quiz.forEach((q, qi)=>{
      const opts = document.querySelectorAll(`.quiz-opt[data-q="${qi}"]`);
      opts.forEach(o=>{
        o.classList.remove('selected');
        const oi = parseInt(o.dataset.o);
        if(oi===q.ans) o.classList.add('correct');
        if(answers[qi]===oi && oi!==q.ans) o.classList.add('wrong');
      });
      if(answers[qi]===q.ans) correct++;
    });
    const res = document.getElementById('quizResult');
    const allRight = correct===m.quiz.length;
    res.style.display = 'block';
    res.innerHTML = `
      <div class="quiz-score" style="color:${allRight?'var(--green)':'var(--red)'}">${correct}/${m.quiz.length}</div>
      <p>${allRight ? '🎉 Превосходно! Тест сдан, модуль завершён!' : '😔 Для сдачи нужно ответить верно на все вопросы. Изучите теорию и попробуйте ещё раз.'}</p>
      ${allRight
        ? `<button class="btn btn-green" onclick="navigate('${mi<CURRICULUM.length-1?'lesson':'home'}','${mi<CURRICULUM.length-1?CURRICULUM[mi+1].lessons[0].id:''}')">Далее: Модуль ${mi+2} →</button>`
        : `<button class="btn btn-blue" onclick="navigate('quiz','${m.id}')">🔄 Пройти тест заново</button>`}`;
    if(allRight && !state.quizzes[m.id]){
      state.quizzes[m.id] = true;
      state.xp += m.xp;
      saveState();
      confetti();
      updateHeader();
      renderSidebar();
    }
    res.scrollIntoView({behavior:'smooth', block:'center'});
  };
}

/* ---------- CERTIFICATE ---------- */
function renderCertificate(main){
  if(!isCourseComplete()){
    const missing = [];
    CURRICULUM.forEach((m, mi)=>{
      m.lessons.forEach(l=>{ if(!state.lessons[l.id]) missing.push(`Модуль ${mi+1}: урок «${l.title}»`); });
      if(!state.quizzes[m.id]) missing.push(`Модуль ${mi+1}: тест по модулю`);
    });
    main.innerHTML = `
    <div class="lesson-head"><h1>🎓 Сертификат</h1></div>
    <div class="quiz-card" style="margin-top:20px">
      <h2 style="margin-bottom:8px">Сертификат пока заблокирован 🔒</h2>
      <p style="color:var(--muted);margin-bottom:6px">Прогресс: <b style="color:var(--yellow)">${progressPct()}%</b> (${completedCount()} из ${TOTAL_ITEMS}). Чтобы получить сертификат, завершите:</p>
      <ul class="locked-list">${missing.map(x=>`<li>⬜ ${x}</li>`).join('')}</ul>
      <div style="margin-top:22px"><button class="btn btn-primary" onclick="navigate('home')">← Вернуться к обучению</button></div>
    </div>`;
    return;
  }
  const today = new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const certId = 'PY-'+Date.now().toString(36).toUpperCase().slice(-6)+'-'+Math.floor(Math.random()*900+100);
  main.innerHTML = `
  <div class="cert-page">
    <div class="cert-form">
      <h2>🎉 Поздравляем с окончанием курса!</h2>
      <p>Вы прошли все ${ALL_LESSONS.length} уроков, решили все практические задачи и сдали все ${CURRICULUM.length} тестов. Введите ваше имя, чтобы получить именной сертификат:</p>
      <input id="certName" placeholder="Ваше имя и фамилия" value="${state.name||''}" maxlength="60">
      <br><button class="btn btn-primary" onclick="generateCert()">✨ Сформировать сертификат</button>
    </div>
    <div id="certSlot"></div>
  </div>`;
  window._certMeta = {today, certId};
  if(state.name) generateCert();
}

function generateCert(){
  const nameInput = document.getElementById('certName');
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); nameInput.style.borderColor='var(--red)'; return; }
  nameInput.style.borderColor='';
  state.name = name; saveState();
  const {today, certId} = window._certMeta;
  const hours = Math.round(ALL_LESSONS.reduce((s,l)=>s+l.minutes,0)/60);
  const cert = `
  <div id="certificate">
    <div class="cert-logo">🐍</div>
    <div class="cert-kicker">PyCodeCamp • Официальный сертификат</div>
    <div class="cert-title">Сертификат об окончании курса</div>
    <div class="cert-sub">«Python-разработчик: с нуля до ООП»</div>
    <div class="cert-name">${name.replace(/</g,'&lt;')}</div>
    <div class="cert-body">
      настоящим подтверждается, что обладатель сертификата успешно завершил полный интерактивный курс
      по языку программирования <b>Python</b>: ${ALL_LESSONS.length} практических уроков (~${hours} ч),
      ${ALL_LESSONS.length} программировочных задач с автоматической проверкой и ${CURRICULUM.length} итоговых тестов,
      охватывающих основы синтаксиса, структуры данных, функции, объектно-ориентированное программирование,
      обработку ошибок, файлы, модули и генераторы списков.
    </div>
    <div class="cert-footer">
      <div class="cert-date">Дата выдачи<b>${today}</b></div>
      <svg class="cert-seal" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f5d76e"/><stop offset="50%" stop-color="#b8933a"/><stop offset="100%" stop-color="#e8c86a"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="54" fill="none" stroke="url(#gold)" stroke-width="4"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="3 3"/>
        ${Array.from({length:24},(_,i)=>{
          const a = i/24*Math.PI*2;
          const x1 = 60+Math.cos(a)*48, y1 = 60+Math.sin(a)*48;
          const x2 = 60+Math.cos(a)*54, y2 = 60+Math.sin(a)*54;
          return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#gold)" stroke-width="2"/>`;
        }).join('')}
        <text x="60" y="52" font-size="26" text-anchor="middle">🐍</text>
        <text x="60" y="74" font-size="13" text-anchor="middle" fill="#8a6d1f" font-weight="bold" font-family="Georgia">PYTHON</text>
        <text x="60" y="88" font-size="9" text-anchor="middle" fill="#8a6d1f" font-family="Georgia">★ MASTER ★</text>
      </svg>
      <div class="cert-id">ID сертификата<b>${certId}</b></div>
    </div>
  </div>`;
  document.getElementById('certSlot').innerHTML = cert + `
    <div class="cert-actions">
      <button class="btn btn-primary" onclick="printCert()">🖨️ Печать / PDF</button>
      <button class="btn btn-ghost" onclick="navigate('home')">← На главную</button>
    </div>`;
  confetti();
}
function printCert(){
  const cert = document.getElementById('certificate');
  document.getElementById('print-root').innerHTML = cert.outerHTML;
  window.print();
}

/* ---------- START ---------- */
render();
</script>
</body>
</html>
